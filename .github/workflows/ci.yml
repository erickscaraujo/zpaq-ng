name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        compiler: [ gcc, clang ]
        exclude:
          - os: windows-latest
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  compatibility:
    name: Compatibility (round-trip + corpus)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Debug with assertions)
        run: cmake -S . -B build-dbg -DCMAKE_BUILD_TYPE=Debug -G Ninja
      - name: Build
        run: cmake --build build-dbg --parallel
      - name: Run compatibility suite
        run: |
          cmake --build build-dbg --target check-compat

  sanitizers:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=address,undefined -G Ninja
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  fuzz:
    name: Fuzz (libFuzzer + ASan, clang)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Configure (fuzzer + ASan)
        run: cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=fuzzer,address -G Ninja
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Run fuzzers
        run: |
          ./build-fuzz/fuzz_archive -runs=5000 -max_len=4096

  format:
    name: Format validation (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src tools tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  benchmarks:
    name: Benchmarks (heavy, manual trigger)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
      - name: Build
        run: cmake --build build --parallel
      - name: Run benchmarks
        run: |
          ./build/zpaq_ng benchmark --json > benchmark.json
          cat benchmark.json